[pytest]
testpaths = tests

# 纯单元测试（test_pure_pursuit.py）不依赖 CARLA；
# 集成测试（test_scenario_integration.py）需 CARLA 与 server，不可用时自动 skip。
# tests/ 与 src/ 均含 __init__.py，pytest 会按标准机制把项目根加入 sys.path。

# ROS Foxy 自带的 ament / launch_testing pytest 插件是按旧版 pytest 写的，
# 在 pytest 8 下会崩（launch_testing 调用 import_path() 时缺少
# consider_namespace_packages 参数，导致整个 tests/ 目录收集失败）。
# 本项目不使用这些插件，逐个禁用。
addopts = -p no:launch -p no:launch_ros -p no:ament_lint -p no:ament_pep257 -p no:ament_flake8 -p no:ament_xmllint -p no:ament_copyright
